<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Test des GIF</title>
<style>
  :root { --bg: #FFF3D6; --card: #FFFFFF; --text: #2B2620; --soft: #9C8F6E; --line: #FBE3A8; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px 18px 60px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; color: var(--soft); line-height: 1.5; margin: 0 0 16px; }
  .btn {
    display: block;
    width: 100%;
    border: none;
    background: var(--text);
    color: var(--bg);
    font-size: 15px;
    font-weight: 600;
    padding: 13px 0;
    border-radius: 12px;
    margin-bottom: 10px;
  }
  .card { background: var(--card); border-radius: 18px; padding: 12px; margin-bottom: 12px; }
  .card img { display: block; max-width: 100%; border-radius: 10px; }
  .info { font-size: 13px; color: var(--soft); margin-top: 6px; }
  .ok { color: #2E7D4F; font-weight: 600; }
  .ko { color: #8C2F1D; font-weight: 600; }
</style>
</head>
<body>
  <h1>Test des GIF</h1>
  <p>Touche un des deux boutons, choisis un ou plusieurs GIF (qui bougent dans tes Photos), puis regarde s'ils bougent ici aussi.</p>

  <button class="btn" type="button" id="b1">Choisir des GIF (Photos)</button>
  <button class="btn" type="button" id="b2">Choisir des GIF (Fichiers)</button>
  <input type="file" id="f1" accept="image/*" multiple hidden>
  <input type="file" id="f2" accept="image/gif" multiple hidden>

  <div id="out"></div>

<script>
  document.getElementById("b1").onclick = () => document.getElementById("f1").click();
  document.getElementById("b2").onclick = () => document.getElementById("f2").click();

  // Un vrai GIF commence par « GIF8 » ; on compte ses images pour savoir
  // s'il est animé (plus d'une image) ou converti en image fixe
  async function analyse(file) {
    const buf = new Uint8Array(await file.arrayBuffer());
    const head = String.fromCharCode(...buf.slice(0, 4));
    if (head !== "GIF8") return { gif: false, images: 0, head };
    let images = 0;
    for (let i = 0; i < buf.length - 1; i++) {
      // Bloc de contrôle graphique : 21 F9, présent avant chaque image animée
      if (buf[i] === 0x21 && buf[i + 1] === 0xF9) images++;
    }
    return { gif: true, images, head };
  }

  async function montrer(files) {
    const out = document.getElementById("out");
    out.innerHTML = "";
    for (const file of files) {
      const r = await analyse(file);
      const card = document.createElement("div");
      card.className = "card";
      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      const info = document.createElement("div");
      info.className = "info";
      const verdict = r.gif && r.images > 1
        ? '<span class="ok">GIF animé conservé</span>'
        : r.gif
          ? '<span class="ko">GIF, mais une seule image</span>'
          : '<span class="ko">Converti par l\'iPhone (plus un GIF)</span>';
      info.innerHTML = verdict + "<br>" + (file.type || "type inconnu") + " · "
        + Math.round(file.size / 1024) + " Ko · " + r.images + " image(s)";
      card.append(img, info);
      out.appendChild(card);
    }
  }

  document.getElementById("f1").onchange = e => montrer([...e.target.files]);
  document.getElementById("f2").onchange = e => montrer([...e.target.files]);
</script>
</body>
</html>
