<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Test du clavier</title>
<style>
  :root { --bg: #FFF3D6; --card: #FFFFFF; --text: #2B2620; --soft: #9C8F6E; --line: #FBE3A8; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px 18px 60px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; color: var(--soft); line-height: 1.5; margin: 0 0 16px; }
  .card { background: var(--card); border-radius: 18px; padding: 18px 16px; margin-bottom: 16px; }
  .label { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  /* Même style que le champ de l'app */
  textarea, .libre {
    display: block;
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 20px;
    padding: 10px 14px;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.35;
    color: var(--text);
    outline: none;
    resize: none;
    min-height: 40px;
  }
  .libre:empty::before { content: attr(data-placeholder); color: var(--soft); }
  form { margin: 0; }
  .mesure { font-size: 13px; color: var(--soft); margin-top: 8px; min-height: 18px; }
</style>
</head>
<body>
  <h1>Test du clavier</h1>
  <p>Touche le champ 1, regarde s'il y a la barre grise au-dessus du clavier et note le chiffre affiché. Ferme le clavier, puis fais pareil avec le champ 2.</p>

  <div class="card">
    <div class="label">1. Champ actuel de l'app</div>
    <form autocomplete="off" onsubmit="return false;">
      <textarea id="champ1" rows="1" autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true" enterkeyhint="send" placeholder="Écrire à l'autre"></textarea>
    </form>
    <div class="mesure" id="mesure1"></div>
  </div>

  <div class="card">
    <div class="label">2. Zone de texte libre</div>
    <div class="libre" id="champ2" contenteditable="plaintext-only" role="textbox" autocorrect="on" autocapitalize="sentences" spellcheck="true" enterkeyhint="send" data-placeholder="Écrire à l'autre"></div>
    <div class="mesure" id="mesure2"></div>
  </div>

<script>
  // Hauteur cachée par le clavier (barre grise comprise), affichée en direct
  function suivre(champId, mesureId) {
    const champ = document.getElementById(champId);
    const mesure = document.getElementById(mesureId);
    let minuteur = null;
    function maj() {
      const vv = window.visualViewport;
      if (!vv) { mesure.textContent = "Mesure indisponible sur cet appareil."; return; }
      const cache = Math.round(window.innerHeight - vv.height);
      mesure.textContent = "Clavier + barre : " + cache + " px";
    }
    champ.addEventListener("focus", () => {
      clearInterval(minuteur);
      minuteur = setInterval(maj, 200);
    });
    champ.addEventListener("blur", () => {
      clearInterval(minuteur);
      setTimeout(maj, 400);
    });
  }
  suivre("champ1", "mesure1");
  suivre("champ2", "mesure2");
</script>
</body>
</html>
